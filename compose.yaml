services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: accessible_finance
      POSTGRES_USER: afa_app
      POSTGRES_PASSWORD: afa_local_password
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U afa_app -d accessible_finance"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data: